# Study Buddy overlay. scripts/install.py merges it into
# ~/.hermes/profiles/studybuddy/config.yaml

# No model block on purpose: the profile keeps the model it inherited when it
# was created with `hermes profile create <name> --clone`. To give this agent
# its own model, add:
#   model:
#     provider: <provider>
#     default: <model id>

# Default on purpose: each student gets a private tutoring session inside the
# group, so one student's quiz does not mix with another's.
group_sessions_per_user: true

telegram:
  require_mention: true
  exclusive_bot_mentions: true
  mention_patterns: []
  allow_bots: mentions
  bots_require_mention: true

gateway:
  streaming:
    enabled: false
  bot_loop_guard:
    enabled: true
    max_events: 20
    window_seconds: 300
    cooldown_seconds: 600

display:
  tool_progress: "off"

agent:
  max_turns: 10
  disabled_toolsets:             # keeps: memory, session_search, skills, todo, cronjob
    - web
    - browser
    - terminal
    - file
    - code_execution
    - delegation
    - messaging
    - clarify
    - image_gen
    - tts

memory:
  memory_enabled: true           # the one agent whose job depends on remembering the student
  user_profile_enabled: true
  write_approval: false
